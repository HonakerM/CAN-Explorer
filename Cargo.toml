[package]
name = "can_explorer"
version = "0.1.0"
edition = "2024"
description = "Cross-platform CAN bus viewer: live stream, per-ID summary, symbol decoding, logging, replay and transmit"

[dependencies]
anyhow = "1.0.104"
can-dbc = { version = "10.0.0", default-features = false }
can-hal-rs = "0.4.2"
can-hal-pcan = "0.4.2"
can-hal-kvaser = "0.4.2"
chrono = "0.4.45"
crossbeam-channel = "0.5.17"
eframe = "0.33.3"
egui = "0.33.3"
egui_extras = "0.33.3"
parking_lot = "0.12.5"
rfd = "0.17.2"
serialport = { version = "4.10.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
socketcan = { version = "3.5", default-features = false }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
